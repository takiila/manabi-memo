name: Audit remaining dependencies
on:
  pull_request:
    paths:
      - '.github/workflows/audit-remaining.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund
      - name: Compare runtime and development audit
        run: |
          npm audit --json > audit-all.json || true
          npm audit --omit=dev --json > audit-runtime.json || true
          node <<'NODE'
          const fs = require('node:fs');
          for (const [scope, path] of [['all','audit-all.json'], ['runtime','audit-runtime.json']]) {
            const audit = JSON.parse(fs.readFileSync(path, 'utf8'));
            const rows = Object.entries(audit.vulnerabilities || {}).map(([name, info]) => ({
              name, severity: info.severity, direct: info.isDirect, range: info.range,
              fix: info.fixAvailable,
              via: info.via.map(item => typeof item === 'string' ? item : { title: item.title, url: item.url, range: item.range }),
            }));
            console.log('AUDIT_SCOPE ' + scope + ' ' + JSON.stringify({
              total: rows.length, counts: audit.metadata?.vulnerabilities || {}, rows,
            }));
          }
          NODE
      - name: Generate compatible indirect dependency updates (never force majors)
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Emit candidate manifests for review
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const path of ['package.json', 'package-lock.json']) {
            console.log('SAFE_FIX_BEGIN ' + path);
            const encoded = fs.readFileSync(path).toString('base64');
            for (let i = 0; i < encoded.length; i += 2048) {
              console.log('SAFE_FIX_CHUNK ' + path + ' ' + encoded.slice(i, i + 2048));
            }
            console.log('SAFE_FIX_END ' + path);
          }
          NODE
