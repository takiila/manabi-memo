name: Prepare Next.js security lockfile
on:
  pull_request:
    paths:
      - '.github/workflows/prepare-security-lock.yml'
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched matching Next.js dependencies
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.3.8 eslint-config-next@16.3.8
      - name: Emit reproducible manifests for review
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const path of ['package.json', 'package-lock.json']) {
            console.log('SECURITY_MANIFEST_BEGIN ' + path);
            const encoded = fs.readFileSync(path).toString('base64');
            for (let i = 0; i < encoded.length; i += 2048) {
              console.log('SECURITY_MANIFEST_CHUNK ' + path + ' ' + encoded.slice(i, i + 2048));
            }
            console.log('SECURITY_MANIFEST_END ' + path);
          }
          NODE
